name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Install system dependencies for Qt (Headless)
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libdbus-1-3

    - name: Lint with Ruff
      run: ruff check .

    - name: Check formatting with Black
      run: black --check .

    - name: Type check with Pyright
      run: pyright --project .

    - name: Check schema drift
      run: python scripts/check_schema_drift.py

    - name: Run tests with pytest (parallel under xvfb)
      run: xvfb-run -a python -m pytest -n auto
