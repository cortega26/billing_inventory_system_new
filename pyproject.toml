[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM", "E4", "E7", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/env.py" = ["E402"]
"utils/system/logger.py" = ["E402"]
"tests/test_services/test_purchase_service.py" = ["E402"]
"tests/test_services/test_sale_service.py" = ["E402"]

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short -v --durations=10"
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "database: Database tests",
    "api: API tests",
    "ui: UI tests",
    "slow: Slow running tests",
    "quick: Quick running tests",
    "logger: Logger tests",
    "analytics: Analytics service tests",
    "customer: Customer service tests",
    "product: Product service tests",
    "inventory: Inventory service tests",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
omit = [
    "*/site-packages/*",
    "*/distutils/*",
    "setup.py",
    "tests/*",
    "ui/*",
    "shibokensupport/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
